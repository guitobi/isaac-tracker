name: Release Client Executable & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Client
        run: |
          cd client
          cargo build --release

      - name: Build Inno Setup Installer
        uses: sbmpost/InnoSetupAction@v1
        with:
          filepath: installer/setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/target/release/isaac-tracker.exe
            installer/Output/IsaacTrackerSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
