[package]
name = "isaac-tracker"
version = "0.1.4"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
keyring = "4.1.5"
linemux = "0.3.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tray-item = "0.10.0"
winreg = "0.52.0"
windows-sys = { version = "0.59.0", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1.12"
